<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Chargement GL - Listes Oracle</title>
  <script src="https://appsforoffice.microsoft.com/lib/1/hosted/office.js"></script>
  <style>
    body { font-family: Segoe UI, Arial, sans-serif; margin: 12px; color: #262626; }
    h2 { font-size: 16px; color: #1F4E79; margin: 0 0 4px; }
    p.sub { font-size: 12px; color: #666; margin: 0 0 14px; }
    button { display:block; width:100%; margin:6px 0; padding:10px; font-size:13px;
             border:1px solid #1F4E79; background:#1F4E79; color:#fff; cursor:pointer; border-radius:4px; }
    button:hover { background:#163a5c; }
    button:disabled { background:#9bb3cc; border-color:#9bb3cc; cursor:default; }
    #log { margin-top:14px; padding:10px; background:#F2F2F2; border:1px solid #D9D9D9;
           font-family:Consolas,monospace; font-size:12px; white-space:pre-wrap; min-height:120px; }
    .ok { color:#1F6B46; } .ko { color:#C74634; } .info { color:#404040; }
    .cible { font-size:11px; color:#888; margin-top:2px; }
  </style>
</head>
<body>
  <h2>Chargement GL &mdash; Listes Oracle</h2>
  <p class="sub">Alimente les listes d&eacute;roulantes du mod&egrave;le WebADI depuis Oracle. Sans macro, sans ActiveX.</p>

  <button id="btnDevise">Remplir la Devise</button>
  <p class="cible">Cible : feuille <b>WebADI</b>, cellule <b>I11</b></p>

  <div id="log">Pr&ecirc;t.</div>

  <script>
    // PROD : remplacer par l'URL du service REST EBS des devises (meme origine que l'add-in -> pas de CORS)
    const SOURCE_DEVISE = "currencies.json";

    function log(msg, cls) {
      var el = document.getElementById("log");
      var line = document.createElement("div");
      if (cls) line.className = cls;
      line.textContent = msg;
      el.appendChild(line);
    }

    Office.onReady(function (info) {
      if (info.host === Office.HostType.Excel) {
        log("Office.js chargé — hôte Excel détecté.", "ok");
        document.getElementById("btnDevise").onclick = remplirDevise;
      } else {
        log("Hôte non-Excel.", "ko");
      }
    });

    async function remplirDevise() {
      var btn = document.getElementById("btnDevise");
      btn.disabled = true;
      try {
        // 1 - appel de la source (mock JSON aujourd'hui, REST EBS en prod)
        var r = await fetch(SOURCE_DEVISE, { cache: "no-store" });
        if (!r.ok) throw new Error("HTTP " + r.status);
        var data = await r.json();
        var codes = data.currencies.map(function (c) { return c.code; });
        log("Source lue : " + codes.length + " devises reçues.", "info");

        // 2 - ecriture dans une feuille cachee + validation sur WebADI!I11
        await Excel.run(async function (ctx) {
          var wb = ctx.workbook;

          var webadi = wb.worksheets.getItemOrNullObject("WebADI");
          await ctx.sync();
          if (webadi.isNullObject) {
            log("Feuille 'WebADI' introuvable — ouvre le modèle GL avant de cliquer.", "ko");
            return;
          }

          var lov = wb.worksheets.getItemOrNullObject("LOV_Devise");
          await ctx.sync();
          if (lov.isNullObject) { lov = wb.worksheets.add("LOV_Devise"); }

          lov.getRange("A1:A1000").clear(Excel.ClearApplyTo.contents);
          var col = codes.map(function (c) { return [c]; });
          lov.getRange("A1").getResizedRange(codes.length - 1, 0).values = col;
          lov.visibility = Excel.SheetVisibility.hidden;

          var cell = webadi.getRange("I11");
          cell.dataValidation.clear();
          cell.dataValidation.rule = {
            list: {
              inCellDropDown: true,
              source: "=LOV_Devise!$A$1:$A$" + codes.length
            }
          };
          cell.format.fill.color = "#FFF4CE";
          await ctx.sync();

          log("OK : liste déroulante posée sur WebADI!I11 (" + codes.length + " devises).", "ok");
          log("→ Clique la cellule I11 de la feuille WebADI : le menu déroulant apparaît.", "info");
        });
      } catch (e) {
        log("ERREUR : " + e.message, "ko");
      } finally {
        btn.disabled = false;
      }
    }
  </script>
</body>
</html>
